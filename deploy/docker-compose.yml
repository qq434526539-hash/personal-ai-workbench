name: personal-ai-workbench

services:
  workbench:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${WORKBENCH_UID:-1000}:${WORKBENCH_GID:-1000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DAILYHOT_API_URL: http://dailyhot:6688
    ports:
      - "${WORKBENCH_BIND_IP:-127.0.0.1}:${WORKBENCH_PORT:-3010}:3010"
    volumes:
      - "${WORKBENCH_DATA_ROOT:-./data}/vault:/data/vault:rw"
      - "${WORKBENCH_DATA_ROOT:-./data}/finance:/data/finance:rw"
    depends_on:
      dailyhot:
        condition: service_healthy
    networks:
      workbench:
        ipv4_address: 172.23.0.10
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  social-sync:
    image: personal-ai-workbench-workbench
    restart: unless-stopped
    user: "${WORKBENCH_UID:-1000}:${WORKBENCH_GID:-1000}"
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command:
      - node
      - -e
      - >-
        const run=()=>fetch('http://workbench:3010/api/social-sync',{method:'POST',headers:{'host':process.env.WORKBENCH_SYNC_HOST||'192.168.31.141','x-sync-token':process.env.SOCIAL_SYNC_TOKEN||''}}).then(r=>r.text()).then(x=>console.log(new Date().toISOString(),x)).catch(console.error);run();setInterval(run,86400000)
    volumes:
      - "${WORKBENCH_DATA_ROOT:-./data}/vault:/data/vault:rw"
    depends_on:
      workbench:
        condition: service_healthy
    networks:
      workbench:
        ipv4_address: 172.23.0.12

  dailyhot:
    image: imsyy/dailyhot-api:latest
    restart: unless-stopped
    environment:
      PORT: "6688"
      CACHE_TTL: "1800"
      ALLOWED_DOMAIN: "*"
    expose:
      - "6688"
    networks:
      workbench:
        ipv4_address: 172.23.0.11
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6688/all').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  workbench:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
