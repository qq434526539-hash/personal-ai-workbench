name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除日志中的本机路径、个人数据和凭据。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除 API Key、Token、Cookie、本机绝对路径和个人数据
          required: true
