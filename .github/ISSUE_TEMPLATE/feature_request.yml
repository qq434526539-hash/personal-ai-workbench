name: Feature request
description: 建议新的能力或数据源
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述工作流问题，而不只是一个按钮或技术名词。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 数据和隐私影响
      description: 需要读取哪些数据？能否默认关闭并最小授权？
    validations:
      required: true
